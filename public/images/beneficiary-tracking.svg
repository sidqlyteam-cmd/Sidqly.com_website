<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#F8FAFC" rx="24"/>
  <!-- Title -->
  <text x="30" y="45" font-family="Inter, sans-serif" font-size="20" font-weight="800" fill="#0B1D2A">Beneficiary Privacy & Security</text>
  <text x="30" y="65" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#475569">Access permissions ensuring secure modesty compliance</text>

  <!-- Step 1: Intention -->
  <rect x="30" y="160" width="130" height="80" rx="16" fill="#FFFFFF" stroke="#0F4D3E" stroke-width="2"/>
  <text x="95" y="195" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#0B1D2A" text-anchor="middle">1. Field Upload</text>
  <text x="95" y="215" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">Raw photo from field</text>

  <!-- Connectors -->
  <line x1="160" y1="200" x2="210" y2="200" stroke="#0F4D3E" stroke-width="2"/>
  <polygon points="210,195 210,205 220,200" fill="#0F4D3E"/>

  <!-- Step 2: Verification Gate -->
  <rect x="220" y="140" width="140" height="120" rx="20" fill="#0F4D3E"/>
  <text x="290" y="185" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">2. Security Gate</text>
  <text x="290" y="205" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#A7F3D0" text-anchor="middle">Automatic blurring</text>
  <text x="290" y="225" font-family="Inter, sans-serif" font-size="9" font-weight="500" fill="#E2E8F0" text-anchor="middle">Wipes GPS & metadata</text>

  <!-- Connectors -->
  <line x1="360" y1="200" x2="410" y2="200" stroke="#15803D" stroke-width="2"/>
  <polygon points="410,195 410,205 420,200" fill="#15803D"/>

  <!-- Step 3: Verified Status -->
  <rect x="420" y="160" width="150" height="80" rx="16" fill="#FFFFFF" stroke="#15803D" stroke-width="2"/>
  <text x="495" y="195" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#15803D" text-anchor="middle">3. Locked Views</text>
  <text x="495" y="215" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">Role-based storage</text>
</svg>
