<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#F8FAFC" rx="24"/>
  <!-- Title -->
  <text x="30" y="45" font-family="Inter, sans-serif" font-size="20" font-weight="800" fill="#0B1D2A">Fund Separation Workflow</text>
  <text x="30" y="65" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#475569">Logical boundaries preventing co-mingling of distinct resources</text>

  <!-- Intake Node -->
  <rect x="30" y="160" width="130" height="80" rx="16" fill="#FFFFFF" stroke="#0F4D3E" stroke-width="2"/>
  <text x="95" y="195" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#0B1D2A" text-anchor="middle">1. Donation Intake</text>
  <text x="95" y="215" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">Sourcing payments</text>

  <!-- Connectors -->
  <line x1="160" y1="200" x2="210" y2="200" stroke="#0F4D3E" stroke-width="2"/>
  <polygon points="210,195 210,205 220,200" fill="#0F4D3E"/>

  <!-- Logical Gate Node -->
  <rect x="220" y="140" width="140" height="120" rx="20" fill="#0F4D3E"/>
  <text x="290" y="185" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">2. Logical Gate</text>
  <text x="290" y="205" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#A7F3D0" text-anchor="middle">Automatic Ledger Isolation</text>
  <text x="290" y="225" font-family="Inter, sans-serif" font-size="9" font-weight="500" fill="#E2E8F0" text-anchor="middle">Separates Zakat / Sadaqah</text>

  <!-- Connectors Upper & Lower -->
  <path d="M 360 170 Q 390 120 410 120" fill="none" stroke="#15803D" stroke-width="2"/>
  <polygon points="410,115 410,125 420,120" fill="#15803D"/>

  <path d="M 360 230 Q 390 280 410 280" fill="none" stroke="#0F4D3E" stroke-width="2"/>
  <polygon points="410,275 410,285 420,280" fill="#0F4D3E"/>

  <!-- Zakat isolated Ledger -->
  <rect x="420" y="80" width="150" height="80" rx="16" fill="#FFFFFF" stroke="#15803D" stroke-width="2"/>
  <text x="495" y="115" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#15803D" text-anchor="middle">Zakat Ledger</text>
  <text x="495" y="135" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">Isolated Masarif files</text>

  <!-- Sadaqah Ledger -->
  <rect x="420" y="240" width="150" height="80" rx="16" fill="#FFFFFF" stroke="#0F4D3E" stroke-width="2"/>
  <text x="495" y="275" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#0B1D2A" text-anchor="middle">Sadaqah Ledger</text>
  <text x="495" y="295" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">Unrestricted campaigns</text>
</svg>
